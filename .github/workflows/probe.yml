name: probe (temp)
on:
  push:
    branches: [feature/live-monitor]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="RegulatoryChangeMonitor/1.0 (portfolio project; +https://github.com/brianphu2310/Regulartory_Change_Monitor)"
          for u in https://asic.gov.au/newsroom/media-releases/ https://www.treasury.gov.au/consultation; do
            curl -s -L -m 25 -A "$UA" "$u" -o /tmp/p.html; echo "== $u"
            grep -o -i '<link[^>]*rss[^>]*>' /tmp/p.html | head -3
            grep -o 'href="[^"]*"' /tmp/p.html | sort -u | grep -v -E "\.(css|js|png|svg|ico)" | grep -E "media-release|/consultation/|newsroom|rss" | head -25
            grep -o -E "[0-9]{1,2} (January|February|March|April|May|June|July|August|September|October|November|December) 20[0-9]{2}" /tmp/p.html | head -5
          done
          curl -s -m 25 -A "$UA" https://www.treasury.gov.au/robots.txt | head -30
