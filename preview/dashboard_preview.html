<style>
/* Layout: navy sidebar + slanted navy title banner; two gold-gradient profile panels on top, three light insight cards below. Bars are extruded 3D blocks. */
:root{--navy:#08241f;--navy0:#04130f;--navy1:#0e3833;--navy2:#14483b;--navy3:#1f6b57;--bt:#288970;--bs:#071f1b;--gold:#d9b25f;--gold2:#e7cf9c;--gold3:#ede0bf;--pg1:#fffdf5;--pg2:#f7ecc8;--pg3:#d9b25f;--page:#e3ebe8;--pill:#f6e1d6;--pillt:#8a3a24;--mute:#cededa;--tm0:#f6efd8;--tm1:#b88a2e;

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--body)}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0;min-height:100vh;max-width:1760px;margin:auto}
aside{background:linear-gradient(180deg,var(--navy1) 0%,var(--navy0) 70%,var(--navy0) 100%);padding:20px 0 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-height:680px;color:#fff;box-shadow:6px 0 24px rgba(10,16,40,.35)}
.brand{display:grid;grid-template-columns:auto 1fr;gap:2px 11px;align-items:center;padding:0 16px 14px}
.mono{grid-row:span 2;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);color:var(--navy);background:linear-gradient(145deg,var(--gold3),var(--gold));box-shadow:0 5px 14px rgba(242,169,0,.4),inset 0 -3px 0 rgba(0,0,0,.15)}
.brand b{font:700 14px var(--display);align-self:end}.brand span{font:600 9.5px var(--body);letter-spacing:.17em;color:var(--gold2);align-self:start}
.ringbox{margin:6px 16px 14px;padding:12px 8px 8px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ringbox small{display:block;font:600 9.5px var(--body);letter-spacing:.14em;color:var(--gold2);margin-top:2px}
nav{display:grid;gap:2px;margin-top:168px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:12px 18px 12px 16px;color:#d9def2;font:500 13px var(--body);border-left:4px solid transparent;transition:background .15s,color .15s}
nav button svg{width:17px;height:17px;flex:none;stroke:var(--gold2)}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-pressed=true]{background:linear-gradient(90deg,rgba(242,169,0,.28),rgba(242,169,0,0));border-left-color:var(--gold);color:#fff;font-weight:600}
nav button:focus-visible,.chip button:focus-visible,#reset:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.foot{margin-top:auto;height:62px;background:linear-gradient(90deg,var(--gold),var(--gold2));display:grid;place-items:center;font:700 9.5px var(--body);letter-spacing:.12em;color:var(--navy);text-align:center;padding:0 8px}
main{min-width:0;padding:14px 22px 26px 20px;display:grid;gap:14px;align-content:start}
.banner{position:relative;height:66px;display:flex;align-items:center;padding:0 30px;color:#fff;background:linear-gradient(100deg,var(--navy),var(--navy2));clip-path:polygon(0 0,100% 0,100% 100%,2.2% 100%);border-radius:0 0 0 0;box-shadow:0 8px 20px rgba(10,16,40,.25)}
.banner h1{margin:0;font:800 clamp(15px,2vw,24px)/1 var(--display);letter-spacing:.16em;text-transform:uppercase;text-wrap:balance}
.banner .st{position:absolute;right:0;top:0;bottom:0;width:36%;overflow:hidden;pointer-events:none}
.banner .st i{position:absolute;top:0;bottom:0;transform:skewX(-28deg)}
.banner .st i:nth-child(1){right:48%;width:7%;background:var(--navy3)}.banner .st i:nth-child(2){right:36%;width:7%;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.banner .st i:nth-child(3){right:-6%;width:38%;background:linear-gradient(90deg,var(--gold),var(--gold3) 85%,#fff3c6)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:28px}
.hint{color:var(--mut);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--gold);border-radius:20px;padding:3px 4px 3px 11px;font-size:12px;box-shadow:0 2px 6px rgba(13,24,56,.12)}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:10px}
#reset{all:unset;cursor:pointer;font-size:12px;color:var(--navy3);text-decoration:underline;text-underline-offset:3px}
.top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{position:relative;border-radius:16px;padding:44px 14px 10px;background:linear-gradient(170deg,var(--pg1) 0%,var(--pg2) 38%,var(--pg3) 100%);box-shadow:0 14px 28px rgba(13,24,56,.28),inset 0 0 0 3px rgba(13,24,56,.9);min-width:0}
.ribbon{position:absolute;left:14px;top:12px;background:linear-gradient(100deg,var(--navy),var(--navy3));color:#fff;font:700 12px var(--display);letter-spacing:.1em;padding:7px 38px 7px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);text-transform:uppercase}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,40%);gap:12px;align-items:stretch}
.ptile{background:linear-gradient(180deg,#fff,#eef0f6);border-radius:14px;padding:10px 12px 8px;box-shadow:0 8px 18px rgba(13,24,56,.22),inset 0 0 0 1px #fff;text-align:center;display:grid;align-content:space-between;gap:4px}
.big{font:800 clamp(30px,3.6vw,46px)/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.cap{background:#e9ebf3;border-radius:6px;padding:3px 6px;font-size:11.5px;color:var(--mut)}
.cap b{color:var(--pillt);font:700 17px var(--display)}
.split{display:flex;justify-content:center;gap:0}
.split button{all:unset;cursor:pointer;flex:1;background:var(--navy);color:#fff;padding:5px 4px;font:600 11px var(--body);display:flex;justify-content:center;align-items:center;gap:5px;transition:filter .15s}
.split button+button{background:#d9dcea;color:var(--navy)}
.split button:hover{filter:brightness(1.15)}.split button[aria-pressed=true]{box-shadow:inset 0 -3px 0 var(--gold)}
.split button:focus-visible{outline:2px solid var(--gold)}
.split svg{width:13px;height:13px}
.bot{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.card{background:linear-gradient(180deg,#fcfcfe,#eceef5);border-radius:16px;padding:12px 14px 12px;box-shadow:0 12px 24px rgba(13,24,56,.2),inset 0 0 0 1px #fff;min-width:0}
.card h2{margin:0 0 8px;font:700 12px var(--display);text-align:center;color:#fff;background:linear-gradient(100deg,var(--navy),var(--navy2));padding:8px 12px;border-radius:4px;letter-spacing:.02em;text-wrap:balance}
.ins{background:#e3e6f0;border-radius:6px;padding:6px 10px;font-size:11.5px;color:var(--ink);margin-bottom:6px;text-align:center;min-height:44px;display:grid;align-items:center}
.ins b{color:var(--pillt)}
.chart{width:100%;display:block}
svg text{font:10.5px var(--body);fill:var(--ink)}
.hit{cursor:pointer}.hit:hover{filter:brightness(1.12)}
.tm{cursor:pointer}.tm:hover rect{filter:brightness(1.08)}
.hm{cursor:pointer}.hm:hover rect{stroke:var(--navy);stroke-width:2}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:7px 10px;font-size:12px;max-width:240px;opacity:0;transition:opacity .1s;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tbl{max-height:260px;overflow:auto;border-radius:6px}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 6px;border-bottom:1px solid var(--line);font-size:12px;cursor:default}
.row .d{font:600 11.5px var(--body);color:var(--navy3);white-space:nowrap}.row .d.o{color:var(--pillt)}
.row small{display:block;color:var(--mut);font-size:10.5px}
.pill{font:700 10px var(--body);padding:2px 8px;border-radius:10px;background:#d9dcea}
.pill.High{background:var(--navy);color:#fff}.pill.Medium{background:var(--gold);color:var(--navy)}

aside{z-index:1}main{position:relative;z-index:2}
.pop{position:absolute;left:-84px;top:56px;width:176px;z-index:6;text-align:center;filter:drop-shadow(0 14px 18px rgba(8,14,36,.5))}
.pop small{display:inline-block;margin-top:-14px;position:relative;background:linear-gradient(100deg,var(--gold),var(--gold2));color:var(--navy);font:800 10px var(--body);letter-spacing:.14em;padding:5px 14px;border-radius:12px}
.bar{padding-left:100px}.pa{padding-left:104px}.pa .ribbon{left:104px}
.ptile{margin-top:-34px;margin-bottom:-20px;position:relative;z-index:3}
.ptile svg{filter:drop-shadow(0 6px 6px rgba(13,24,56,.28))}
.panel{margin-bottom:12px}
@media (max-width:900px){.bar{padding-left:0}nav{margin-top:6px}.pop{display:none}.pa{padding-left:14px}.pa .ribbon{left:14px}.tw{margin-top:0;margin-bottom:0}.ribbon{left:-8px!important}nav{margin-top:6px}}

:root{--c:18px;--c2:15px}
aside{z-index:1}
.fr{position:absolute;inset:0;filter:drop-shadow(0 12px 12px rgba(13,24,56,.28));pointer-events:none;z-index:0}
.fr .in{position:absolute;inset:0;background:var(--bd);clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.fr .in::after{content:'';position:absolute;inset:var(--bw);background:var(--fill);clip-path:polygon(var(--c2) 0,calc(100% - var(--c2)) 0,100% var(--c2),100% calc(100% - var(--c2)),calc(100% - var(--c2)) 100%,var(--c2) 100%,0 calc(100% - var(--c2)),0 var(--c2))}
.panel{background:none;box-shadow:none;padding:52px 18px 26px;--bd:var(--navy);--bw:4px;--fill:linear-gradient(170deg,var(--pg1) 0%,var(--pg2) 38%,var(--pg3) 100%)}
.panel>.pbody{position:relative;z-index:1}
.card{background:none;box-shadow:none;padding:16px 16px 16px;position:relative;--bd:#fff;--bw:2px;--fill:linear-gradient(180deg,#fbfbfe,#e9ecf4);--c:16px;--c2:14px}
.card>*:not(.fr){position:relative;z-index:1}
.card h2{margin:-8px -24px 10px;padding:10px 30px;border-radius:0;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);background:linear-gradient(100deg,var(--navy),var(--navy3));box-shadow:none}
.ribbon{left:-14px;top:-15px;padding:10px 40px;z-index:4;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);background:linear-gradient(100deg,var(--navy),var(--navy3));border:0}
.pa .ribbon{left:84px}
.tw{margin-top:-40px;margin-bottom:-22px;position:relative;z-index:3;filter:drop-shadow(0 12px 10px rgba(13,24,56,.34))}
.ptile{--c:16px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));background:linear-gradient(180deg,#fff,#e9ecf5);box-shadow:none;padding:14px 14px 10px;height:100%}
.pop{left:-118px;top:70px;width:204px}
.pop small{margin-top:-12px}
nav{margin-top:222px}
.pa{padding-left:104px}
.bot{align-items:stretch;gap:20px}.top{gap:22px}
@media (max-width:1180px){.bot{grid-template-columns:repeat(2,minmax(0,1fr))}.bot .col:first-child{grid-column:span 2}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}
aside{position:static;height:auto;min-height:0;padding:14px 0 0}.ringbox{display:none}.foot{display:none}
nav{display:flex;overflow-x:auto;gap:0}nav button{white-space:nowrap;flex:none;border-left:0;border-bottom:3px solid transparent;padding:10px 14px}nav button[aria-pressed=true]{border-bottom-color:var(--gold);background:rgba(242,169,0,.18)}
main{padding:14px 16px 26px}.top{grid-template-columns:minmax(0,1fr)}.pbody{grid-template-columns:minmax(0,1fr)}.bot{grid-template-columns:minmax(0,1fr)}.bot .col:first-child{grid-column:auto}
.banner{clip-path:none;padding:0 16px}.banner .st{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){nav{margin-top:6px}.tw{margin-top:6px;margin-bottom:-14px}.pa .ribbon,.ribbon{left:-8px}.pa{padding-left:16px}.pop{display:none}.ptile{height:auto}.panel{padding-bottom:34px}}
/* v4 additions */
.tag{margin-left:auto;font:600 10.5px var(--body);letter-spacing:.06em;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.view{display:grid;gap:22px;align-content:start;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.g2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:stretch}
.g21{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.leg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl2{width:100%;border-collapse:collapse;font-size:12.5px}

.dl{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.dl.o{color:var(--pillt)}.dl.s{color:#b8741a}.dl.k{color:var(--navy3)}
.detail{background:linear-gradient(180deg,#fff,#eef2ef);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;min-height:62px}
.detail b{font:700 13px var(--display);display:block;margin-bottom:3px}.detail span{color:var(--mut)}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fb button{all:unset;cursor:pointer;font:600 11px var(--body);padding:5px 12px;border-radius:14px;background:#fff;border:1px solid var(--navy3);color:var(--navy)}
.fb button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.fb button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fb small{color:var(--mut);font-size:11px;margin-right:4px;font-weight:600;letter-spacing:.08em}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:6px -6px 4px}
.step{background:linear-gradient(100deg,var(--navy),var(--navy3));color:#fff;padding:14px 26px 14px 30px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%,20px 50%);margin-left:-8px}
.step:first-child{clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%);margin-left:0;padding-left:18px}
.step b{font:700 12px var(--display);display:block;letter-spacing:.06em;color:var(--gold2)}.step span{font-size:11.5px;opacity:.92}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px}
.defs div{font-size:12.5px}.defs b{color:var(--navy3);font-family:var(--display);font-size:12px;display:block}
.bdg{display:flex;gap:8px;flex-wrap:wrap}.bdg span{font:600 11px var(--body);padding:5px 12px;border-radius:14px;border:1px solid var(--gold);background:#fff}
.note2{font-size:12.5px;color:var(--mut);margin:0}
.big2{font:800 28px var(--display);color:var(--navy)}
@media (max-width:1180px){.g3,.g2,.g21{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>*:first-child,.g2>*:first-child{grid-column:span 2}}
@media (max-width:900px){.g3,.g2,.g21{grid-template-columns:minmax(0,1fr)}.g3>*:first-child,.g2>*:first-child{grid-column:auto}.steps{grid-template-columns:minmax(0,1fr)}.step,.step:first-child{clip-path:none;margin:0 0 4px;border-radius:6px;padding:12px 16px}.defs{grid-template-columns:minmax(0,1fr)}.tag{display:none}}
</style>

 const tcount=d3.rollup(recs,v=>v.length,r=>r.t);const T=[...tcount].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

 const links=[];const lk=(a,b,fa,fb)=>{d3.rollup(recs,v=>v.length,fa,fb).forEach((m,ka)=>m.forEach((v,kb)=>links.push({a:pos[a+'|'+ka],b:pos[b+'|'+kb],v,t:a===0?ka:null,i:a===0?null:ka,ci:a})))};
 lk(0,1,r=>r.t,r=>r.i);lk(1,2,r=>r.i,r=>r.s);
 // topic->impact and impact->status; stack links in node order
 const order=(arr,ci)=>arr.filter(l=>l.ci===ci);

  nodes.filter(n=>n.ci===ci).forEach(n=>{L.filter(l=>l.a===n).sort((p,q)=>p.b.y-q.b.y).forEach(l=>{l.w=l.v*n.k;l.y0=n.oy+l.w/2;n.oy+=l.w})});
  nodes.filter(n=>n.ci===ci+1).forEach(n=>{L.filter(l=>l.b===n).sort((p,q)=>p.a.y-q.a.y).forEach(l=>{l.y1=n.iy+l.w/2;n.iy+=l.w})})};

 const path=l=>{const x0=lx(l.ci),x1=x[l.ci+1],m=(x0+x1)/2;return `M${x0},${l.y0}C${m},${l.y0} ${m},${l.y1} ${x1},${l.y1}`};
 const sel=F.tp,selI=F.imp;

 const col=n=>n.ci===0?'var(--navy3)':n.ci===1?IMC[n.n]:(n.n==='Actioned'?'var(--gold)':'var(--navy)');
 let g='<defs>'+'</defs>';
 g+=links.map((l,i)=>{const c=l.ci===0?IMC[l.b.n]:(l.b.n==='Actioned'?'var(--gold)':'var(--navy3)');return `<path class="fl" data-ci="${l.ci}" data-k="${esc(l.ci===0?l.a.n:l.b.n)}" d="${path(l)}" fill="none" stroke="${c}" stroke-width="${Math.max(1,l.w)}" stroke-opacity="${linkOn(l)?.5:.12}"/>`}).join('');

 $('#dI2').innerHTML=Math.max(...tot)?`<span>Busiest month: <b>${new Date(months[pk]+'-01').toLocaleString('en-AU',{month:'long',year:'numeric'})}</b> with ${tot[pk]} changes.</span>`:'<span>No data for this filter.</span>';
 // topics donut
 const Rt=rowsFor(['tp']);const cnt=d3.rollup(Rt.flatMap(r=>r.tp).filter(t=>(DEPMAP[t]||[]).includes(dep)),v=>v.length,t=>t);const items=[...cnt].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
 const th=$('#dC3'),TW=th.clientWidth||320,TH=250;const tc=[cv('--navy'),cv('--gold'),cv('--navy3'),cv('--tm1'),cv('--mute'),cv('--bt')];
 if(!items.length){th.innerHTML='<div class="hint" style="padding:30px;text-align:center">No data for this filter.</div>';$('#dI3').innerHTML='<span>No data for this filter.</span>'}else{
  const tt=items.reduce((s,x)=>s+x.value,0);const arc=d3.arc().innerRadius(52).outerRadius(86).padAngle(.02).cornerRadius(3);const pie=d3.pie().value(d=>d.value).sort(null)(items);
  let t2=`<g transform="translate(${TW/2},112)">`+pie.map((p,i)=>`<path class="hit" data-c="${esc(p.data.name)}" d="${arc(p)}" fill="${tc[i%tc.length]}" opacity="${F.tp&&F.tp!==p.data.name?.38:1}" ${F.tp===p.data.name?'stroke="var(--gold)" stroke-width="3"':''} tabindex="0" role="button"/>`).join('')+`<text text-anchor="middle" y="4" style="font:800 22px var(--display);fill:var(--navy)">${tt}</text><text text-anchor="middle" y="20" style="font-size:9.5px">topic mentions</text></g>`;
  const lg=items.map((it,i)=>`<g transform="translate(${8+(i%2)*(TW/2)},${216+Math.floor(i/2)*16})"><rect width="9" height="9" rx="2" fill="${tc[i%tc.length]}"/><text x="14" y="8.5" style="font-size:10px">${esc(it.name)} ${it.value}</text></g>`).join('');
  th.innerHTML=`<svg class="chart" viewBox="0 0 ${TW} ${230+Math.ceil(items.length/2)*16}" height="${230+Math.ceil(items.length/2)*16}">${t2}${lg}</svg>`;
  th.querySelectorAll('.hit').forEach(p=>{key(p,()=>toggle('tp',p.dataset.c));const it=items.find(q=>q.name===p.dataset.c);p.onmousemove=e=>showTip(e,`<b>${esc(it.name)}</b><br>${it.value} changes (${pct(it.value,tt)}%)`);p.onmouseleave=hideTip});
  $('#dI3').innerHTML=`<span><b>${items[0].name}</b> makes up ${pct(items[0].value,tt)}% of the topic mentions in ${dep}.</span>`}
 const O=rowsFor().filter(r=>r.open);const T=O.filter(r=>r.dlDate);table($('#dTab'),T);detail($('#dDet'));
 $('#dNote').textContent=`${O.length-T.length} more open action${O.length-T.length===1?'':'s'} in this view have no stated deadline.`;
}

/* ---------- Action tracker ---------- */
function viewTracker(){return `<div class="g21">${card('Deadline calendar','<div class="ins" id="tI1"></div><div id="tCal"></div><div class="leg" id="tLeg"></div>')}${card('Deadline radar','<div class="ins" id="tI2"></div><div id="tBub"></div><div class="leg"><span><i style="background:var(--gold)"></i>High</span><span><i style="background:var(--navy3)"></i>Medium</span><span><i style="background:var(--mute)"></i>Low</span></div>')}</div>
${card('All open actions with a deadline','<div class="fb" id="tFb"></div><div class="detail" id="tDet"></div><div class="tw2" id="tTab"></div>')}`}
function drawTracker(){
 const RC=rowsFor(['day']).filter(r=>r.open&&r.dlDate);const host=$('#tCal'),W=host.clientWidth||440;
 const start=new Date(TODAY);start.setDate(start.getDate()-((start.getDay()+6)%7));const WK=17,cs=Math.min(24,(W-30)/WK),gap=3;
 const by=d3.rollup(RC,v=>v.length,r=>r.dlDate);const mx=Math.max(1,...by.values(),1);const col=d3.scaleLinear().domain([0,mx]).range([cv('--tm0'),cv('--tm1')]);let s='';
 ['M','T','W','T','F','S','S'].forEach((l,i)=>s+=`<text x="0" y="${20+i*(cs+gap)+cs*.7}" style="font-size:9px">${l}</text>`);
 let lastM=-1,lastW=-9;
 for(let w=0;w<WK;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);const k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;const n=by.get(k)||0;
  if(d===0&&dt.getMonth()!==lastM){lastM=dt.getMonth();if(w-lastW>=3){lastW=w;s+=`<text x="${16+w*(cs+gap)}" y="10" style="font-size:9.5px">${dt.toLocaleString('en-AU',{month:'short'})}</text>`}}
  const isT=dt.getTime()===TODAY.getTime();
  s+=`<rect class="cell hm" x="${16+w*(cs+gap)}" y="${20+d*(cs+gap)}" width="${cs}" height="${cs}" rx="4" fill="${n?col(n):'#e9efec'}" ${F.day===k?'stroke="var(--navy)" stroke-width="2.5"':isT?'stroke="var(--pillt)" stroke-width="2"':''} data-k="${k}" data-n="${n}" style="cursor:${n?'pointer':'default'}"/>`}
 host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${24+7*(cs+gap)}" height="${24+7*(cs+gap)}">${s}</svg>`;
 host.querySelectorAll('.cell').forEach(c=>{c.onclick=()=>{if(+c.dataset.n||F.day===c.dataset.k)toggle('day',c.dataset.k)};c.onmousemove=e=>showTip(e,`<b>${fmtD({dlDate:c.dataset.k})}</b><br>${c.dataset.n} open action${c.dataset.n==='1'?'':'s'}`);c.onmouseleave=hideTip});
 const ovd=rowsFor(['day']).filter(r=>r.open&&r.dl!=null&&r.dl<0).length,nxt=rowsFor().filter(r=>r.open&&r.dl!=null&&r.dl>=0).sort((a,b)=>a.dl-b.dl)[0];
 $('#tI1').innerHTML=nxt?`<span>Next deadline: <b>${fmtD(nxt)}</b> (${nxt.dl} days). <b>${ovd}</b> open actions are already overdue.</span>`:'<span>No upcoming deadlines for this filter.</span>';
 $('#tLeg').innerHTML=`<span><i style="background:var(--tm0)"></i>1 deadline</span><span><i style="background:var(--tm1)"></i>${mx>1?mx+' deadlines':'more'}</span><span><i style="background:transparent;border:2px solid var(--pillt)"></i>today</span>`;
 // bubble
 const R=rowsFor().filter(r=>r.open&&r.dl!=null);const bh=$('#tBub'),BW=bh.clientWidth||440,BH=262,m={l:74,r:10,t:10,b:26};
 const bx=d3.scaleLinear().domain([-300,120]).range([m.l,BW-m.r]),by2=d3.scaleBand().domain(AGS).range([m.t,BH-m.b]).padding(.1);
 let b=`<rect x="${bx(-300)}" y="${m.t}" width="${bx(0)-bx(-300)}" height="${BH-m.t-m.b}" fill="var(--pillt)" fill-opacity=".08"/><rect x="${bx(0)}" y="${m.t}" width="${bx(30)-bx(0)}" height="${BH-m.t-m.b}" fill="var(--gold)" fill-opacity=".3"/>`;
 AGS.forEach(a=>{b+=`<text x="${m.l-8}" y="${by2(a)+by2.bandwidth()/2}" text-anchor="end" dy=".35em" style="font:600 10.5px var(--body);${F.src===a?'fill:var(--pillt)':''}">${a}</text><line x1="${m.l}" x2="${BW-m.r}" y1="${by2(a)+by2.bandwidth()}" y2="${by2(a)+by2.bandwidth()}" stroke="var(--line)" stroke-dasharray="2 3"/>`});
 [-300,-200,-100,0,100].forEach(t=>b+=`<text x="${bx(t)}" y="${BH-8}" text-anchor="middle" style="font-size:9px">${t}</text>`);
 b+=`<line x1="${bx(0)}" x2="${bx(0)}" y1="${m.t}" y2="${BH-m.b}" stroke="var(--pillt)" stroke-width="1.5"/><text x="${bx(0)+4}" y="${m.t+10}" style="font:700 9px var(--body);fill:var(--pillt)">today</text><text x="${bx(-300)+4}" y="${BH-m.b-5}" style="font-size:9px">← overdue (days)</text>`;
 R.forEach(r=>{const j=((r.id*37)%100)/100-.5;b+=`<circle class="hit" cx="${bx(Math.max(-300,Math.min(120,r.dl)))}" cy="${by2(r.src)+by2.bandwidth()/2+j*by2.bandwidth()*.7}" r="${r.id===PICK?8:5.5}" fill="${IMC[r.imp]}" stroke="${r.id===PICK?'var(--navy)':'#fff'}" stroke-width="${r.id===PICK?2.5:1}" data-id="${r.id}"/>`});
 bh.innerHTML=`<svg class="chart" viewBox="0 0 ${BW} ${BH}" height="${BH}">${b}</svg>`;
 bh.querySelectorAll('.hit').forEach(c=>{const r=ROWS[+c.dataset.id];c.onclick=()=>{PICK=r.id;draw()};c.onmousemove=e=>showTip(e,`<b>${esc(r.title)}</b><br>${r.src} · ${r.imp} · ${r.dl<0?-r.dl+' days overdue':r.dl+' days left'}`);c.onmouseleave=hideTip});
 const hi=R.filter(r=>r.imp==='High'&&r.dl<0).length;$('#tI2').innerHTML=`<span><b>${hi}</b> High-impact actions are overdue. Each dot is one open action, placed by days to its deadline.</span>`;
 // filters + table
 const mk=(lbl,k,vals)=>`<small>${lbl}</small>`+vals.map(v=>`<button data-k="${k}" data-v="${esc(v)}" aria-pressed="${F[k]===v}">${esc(v)}</button>`).join('');
 $('#tFb').innerHTML=mk('IMPACT','imp',IMPS)+'<span style="width:12px"></span>'+mk('AGENCY','src',AGS);
 $('#tFb').onclick=e=>{const bt=e.target.closest('button');if(bt)toggle(bt.dataset.k,bt.dataset.v)};
 const T=rowsFor().filter(r=>r.open&&r.dlDate);table($('#tTab'),T,80);detail($('#tDet'));
}

/* ---------- About ---------- */
function viewAbout(){return `<div class="g2">${card('What this project does',`<p class="note2" style="color:var(--ink);font-size:13.5px">Law firms track changes from several regulators at once. This report classifies each change by agency, topic, impact and the department it reaches, then shows which actions are open and how soon they are due.</p><div class="steps"><div class="step"><b>COLLECT</b><span>Agency feeds and notices</span></div><div class="step"><b>CLASSIFY</b><span>Keyword rules set topic, impact, audience</span></div><div class="step"><b>MODEL</b><span>Star schema, DAX measures</span></div><div class="step"><b>REPORT</b><span>Power BI pages by department</span></div></div>`)}${card('Data and limits',`<p class="note2" style="color:var(--ink)">All records are <b>synthetic sample data</b> created for demonstration. They are not real announcements and not legal advice.</p><p class="note2" style="margin-top:8px">Impact and topic come from keyword rules, not legal review. A change can reach more than one department, so department counts add up to more than the total.</p>`)}</div>
<div class="g21">${card('Definitions',`<div class="defs"><div><b>Impact</b>High, Medium or Low, set by keywords such as penalty, mandatory or must.</div><div><b>Action required</b>The change states an obligation or step the firm must take.</div><div><b>Open action</b>Action required and status is not Actioned.</div><div><b>Deadline</b>Date taken from the text of the change. Blank when none is stated.</div><div><b>Days left</b>Deadline minus today. Negative means overdue.</div><div><b>Actioned rate</b>Share of changes whose status is Actioned.</div></div>`)}${card('Sources and tools',`<div class="bdg" style="margin-bottom:12px">${AGS.map(a=>`<span>${a}</span>`).join('')}</div><div class="bdg"><span>Python</span><span>SQLite</span><span>Power Query</span><span>DAX</span><span>Power BI</span><span>Star schema</span></div><p class="note2" style="margin-top:12px">Agency badges are plain text labels. They are not official logos.</p>`)}</div>
${card('Department mapping',`<div class="defs">${Object.entries(DEPMAP).map(([t,d])=>`<div><b>${t}</b>${d.join(' and ')}</div>`).join('')}</div>`)}`}

/* ---------- router ---------- */
function build(){const v=$('#view');v.innerHTML=PAGE==='overview'?viewOverview():isDept()?viewDept():PAGE==='tracker'?viewTracker():viewAbout();BUILT=PAGE}
function draw(){if(PAGE==='overview')drawOverview();else if(isDept())drawDept();else if(PAGE==='tracker')drawTracker()}
function render(){chrome();pop();if(BUILT!==PAGE)build();draw()}
nav();render();

const THEMES=[['1 · Emerald & Champagne',null],['8 · Forest & Terracotta',['#1d2f1f','#3f6b3a','#c9673a','#f1dfc6','#e8efe2']],['9 · Deep Teal & Coral',['#0b2e33','#1c6b6e','#ff7a64','#f6e3c8','#e2edee']],['10 · Indigo & Mint',['#1b1a4a','#3d3a9e','#5fd3b0','#e6f7f0','#e8e8f4']],['11 · Slate & Lime',['#1f2933','#46586b','#b6d94c','#eef5d3','#e6eaee']],['12 · Wine & Sage',['#3a1226','#7a2748','#9bb59a','#f0e6d8','#efe6ea']],['13 · Sand & Charcoal',['#2b2b2b','#6b5b4b','#c79a54','#f5ecd9','#f3efe8']],['14 · Royal Purple & Gold',['#22104a','#4b2aa0','#e0b64c','#f8ecc4','#e9e5f3']],['15 · Steel Blue & Amber',['#10263c','#2c5f8a','#f0a030','#fbe6bd','#e4ebf1']]];
function applyTheme(i){const root=document.documentElement,t=THEMES[i][1];
 ['--navy','--navy0','--navy1','--navy2','--navy3','--bt','--bs','--gold','--gold2','--gold3','--pg1','--pg2','--pg3','--page','--pill','--pillt','--mute','--tm0','--tm1','--ink','--mut','--line'].forEach(k=>root.style.removeProperty(k));
 if(t){const [D,P,A,L,G]=t,m=(a,b,x)=>d3.interpolateRgb(a,b)(x);const o={'--navy':D,'--navy0':m(D,'#000',.45),'--navy1':m(D,P,.2),'--navy2':m(D,P,.5),'--navy3':P,'--bt':m(P,'#fff',.22),'--bs':m(D,'#000',.35),'--gold':A,'--gold2':m(A,'#fff',.4),'--gold3':m(A,'#fff',.65),'--pg1':m(L,'#fff',.7),'--pg2':L,'--pg3':A,'--page':G,'--pill':m(A,'#fff',.8),'--pillt':m(A,'#000',.6),'--mute':m(P,'#fff',.8),'--tm0':m(L,'#fff',.3),'--tm1':m(A,'#000',.2),'--ink':m(D,'#000',.3),'--mut':m(D,'#fff',.4),'--line':m(G,D,.12)};
  Object.entries(o).forEach(([k,v])=>root.style.setProperty(k,v))}
 render()}

const sel=document.getElementById('thm');sel.innerHTML=THEMES.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('');sel.onchange=()=>applyTheme(+sel.value);sel.value='4';applyTheme(4);
document.getElementById('flat').onclick=function(){FLAT=!FLAT;this.textContent='Bars: '+(FLAT?'Flat':'3D');this.setAttribute('aria-pressed',FLAT);draw()};
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(draw,120)}).observe(document.querySelector('main'));
</script>
