function flow(host,H){

 const tcount=d3.rollup(recs,v=>v.length,r=>r.t);const T=[...tcount].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
 const sts=[...new Set(recs.map(r=>r.s))].sort((a,b)=>(a==='Actioned'?-1:b==='Actioned'?1:a<b?-1:1));
 const cols=[T.map(t=>t.name),IMPS.filter(i=>recs.some(r=>r.i===i)),sts];
 const tot=recs.length,avail=H-top-8;

  names.forEach(n=>{const v=cnt(n),h=Math.max(6,v*k);pos[ci+'|'+n]={ci,n,v,y,h,k,oy:y,iy:y};y+=h+gap;nodes.push(pos[ci+'|'+n])})});
 const x=[0,(W-nw)/2,W-nw],labW=[0,0,0];
 const links=[];const lk=(a,b,fa,fb)=>{d3.rollup(recs,v=>v.length,fa,fb).forEach((m,ka)=>m.forEach((v,kb)=>links.push({a:pos[a+'|'+ka],b:pos[b+'|'+kb],v,t:a===0?ka:null,i:a===0?null:ka,ci:a})))};
 lk(0,1,r=>r.t,r=>r.i);lk(1,2,r=>r.i,r=>r.s);
 // topic->impact and impact->status; stack links in node order
 const order=(arr,ci)=>arr.filter(l=>l.ci===ci);
 const place=ci=>{const L=order(links,ci);
  nodes.filter(n=>n.ci===ci).forEach(n=>{L.filter(l=>l.a===n).sort((p,q)=>p.b.y-q.b.y).forEach(l=>{l.w=l.v*n.k;l.y0=n.oy+l.w/2;n.oy+=l.w})});
  nodes.filter(n=>n.ci===ci+1).forEach(n=>{L.filter(l=>l.b===n).sort((p,q)=>p.a.y-q.a.y).forEach(l=>{l.y1=n.iy+l.w/2;n.iy+=l.w})})};

 // middle column: outgoing links use their own scale

 const lx=ci=>x[ci]+nw;
 const path=l=>{const x0=lx(l.ci),x1=x[l.ci+1],m=(x0+x1)/2;return `M${x0},${l.y0}C${m},${l.y0} ${m},${l.y1} ${x1},${l.y1}`};
 const sel=F.tp,selI=F.imp;

 const col=n=>n.ci===0?'var(--navy3)':n.ci===1?IMC[n.n]:(n.n==='Actioned'?'var(--gold)':'var(--navy)');

 $('#cK').innerHTML=kpis([[pct(req,av)+'%','CAPACITY LOAD (5 MONTHS)'],[hrs(ov),'HOURS OVER CAPACITY','var(--pillt)'],[(ov/152).toFixed(1),'FTE-MONTHS SHORT'],[kmoney(d3.sum(R,r=>r.ong)),'ONGOING COST / YR'],[`${ok} / ${L.length}`,'SOURCES OK (LIVE)']]);
 const months=[...new Set(C.map(c=>c[0]))].sort(),bym=d3.rollup(C,v=>({r:d3.sum(v,c=>c[2]),a:d3.sum(v,c=>c[3])}),c=>c[0]);const m0=months[0],b0=bym.get(m0);
 $('#cT').innerHTML=`<span>The money is manageable; the people are not. <b>${mon(m0)}</b> needs <b>${hrs(b0.r)} hours</b> against <b>${hrs(b0.a)}</b> available, then the load falls away. Hiring for a one-month peak is wasteful: bring in help for that month instead.</span>`;
 const roles=FIN.roles.map(r=>r[0]),host=$('#cHeat'),W=host.clientWidth||520,lw=150,cw=(W-lw)/months.length,rh=30,H=24+roles.length*rh;const get=(m,r)=>C.find(c=>c[0]===m&&c[1]===r);
 let s=months.map((m,j)=>`<text x="${lw+j*cw+cw/2}" y="15" text-anchor="middle" style="font:700 11px var(--body)">${mon(m)}</text>`).join('');
 roles.forEach((r,i)=>{s+=`<text x="${lw-8}" y="${24+i*rh+rh/2+4}" text-anchor="end" style="font:600 11.5px var(--body)">${esc(r)}</text>`;months.forEach((m,j)=>{const c=get(m,r);if(!c)return;const l=c[3]?c[2]/c[3]:0;const col=l>1?'#E8A29A':l>.8?'#F3D27A':'#D9EC9A';
  s+=`<g class="hm" data-t="${esc(r)} · ${mon(m)}<br>${hrs(c[2])} h needed of ${hrs(c[3])} h"><rect x="${lw+j*cw+1.5}" y="${24+i*rh+1.5}" width="${cw-3}" height="${rh-3}" rx="4" fill="${c[2]>0.05?col:'#eef1ee'}"/><text x="${lw+j*cw+cw/2}" y="${24+i*rh+rh/2+4}" text-anchor="middle" style="font:${l>1?700:500} 11px var(--body)">${c[2]>0.05?Math.round(l*100)+'%':''}</text></g>`})});
 host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg>`;host.querySelectorAll('.hm').forEach(g=>{g.onmousemove=e=>showTip(e,g.dataset.t);g.onmouseleave=hideTip});
 const hot=C.filter(c=>c[0]===m0&&c[2]>c[3]).sort((a,b)=>b[4]-a[4]);$('#cI1').innerHTML=`<span><b>${hot.length}</b> roles are over capacity in ${mon(m0)}${hot.length?`, led by <b>${esc(hot[0][1])}</b> (${hrs(hot[0][2])} h against ${hrs(hot[0][3])} h)`:''}.</span>`;
 const ids=new Set(R.filter(r=>r.ws==='Outstanding').map(r=>r.i)),need=[...d3.rollup(FIN.effort.filter(e=>ids.has(e[0])),v=>d3.sum(v,e=>e[2]),e=>e[1])].map(([k,a])=>({k,a,b:0})).sort((x,y)=>y.a-x.a);
 $('#cI2').innerHTML=`<span>The top two roles hold <b>${pct(d3.sum(need.slice(0,2),r=>r.a),d3.sum(need,r=>r.a))}%</b> of the outstanding hours.</span>`;
 hbars($('#cRole'),need,{lw:150,fa:v=>hrs(v)+' h',tip:r=>`<b>${esc(r.k)}</b><br>${hrs(r.a)} outstanding hours`});
 const due=[...d3.rollup(R.filter(r=>r.ws==='Outstanding'),v=>d3.sum(v,r=>r.oh),r=>r.td.slice(0,7))].sort((a,b)=>a[0]<b[0]?-1:1);const dh=$('#cDue'),DW=dh.clientWidth||420,DH=220,m={l:8,r:8,t:16,b:26};
 const x=d3.scaleBand().domain(due.map(d=>d[0])).range([m.l,DW-m.r]).padding(.3),y=d3.scaleLinear().domain([0,Math.max(1,...due.map(d=>d[1]))]).range([DH-m.b,m.t]);
 dh.innerHTML=`<svg class="chart" viewBox="0 0 ${DW} ${DH}" height="${DH}">${due.map(([k,v])=>{const past=k<FIN.asOf.slice(0,7);return `<rect x="${x(k)}" y="${y(v)}" width="${x.bandwidth()}" height="${DH-m.b-y(v)}" rx="3" fill="${past?'var(--pillt)':'var(--gold)'}"/><text x="${x(k)+x.bandwidth()/2}" y="${y(v)-4}" text-anchor="middle" style="font:700 10px var(--body)">${hrs(v)}</text><text x="${x(k)+x.bandwidth()/2}" y="${DH-8}" text-anchor="middle" style="font-size:9.5px">${mon(k+'-01')}</text>`}).join('')}</svg>`;
 const late=d3.sum(due.filter(d=>d[0]<FIN.asOf.slice(0,7)),d=>d[1]);$('#cI3').innerHTML=`<span><b>${hrs(late)} hours</b> of the backlog were due before ${mon(FIN.asOf)} (dark bars).</span>`;
 $('#cI4').innerHTML=`<span>Real run on <b>${fdate(FIN.logDate)}</b> from GitHub Actions: <b>${ok}</b> of ${L.length} agency sites answered. Blocked sites are logged, not worked around.</span>`;
 $('#cLog').innerHTML=`<table class="tbl2"><thead><tr><th>AGENCY</th><th>RESULT</th><th>ITEMS</th></tr></thead><tbody>${L.map(l=>`<tr><td><b>${esc(l[0])}</b></td><td style="color:${l[1].startsWith('ok')?'var(--navy3)':'var(--pillt)'}">${esc(l[1].startsWith('ok')?l[1]:l[1].split(':').slice(0,2).join(':').replace(/HTTPSConnectionPool.*$/,'').trim())}</td><td class="dl">${l[2]}</td></tr>`).join('')}</tbody></table>`}

/* ---------- About ---------- */
function viewAbout(){return `<div class="g2">${card('What this project does',`<p class="note2" style="color:var(--ink);font-size:13.5px">Law firms track changes from several regulators at once. This report classifies each change by agency, topic, impact and the department it reaches, then shows which actions are open and how soon they are due.</p><div class="steps"><div class="step"><b>COLLECT</b><span>Agency feeds and notices</span></div><div class="step"><b>CLASSIFY</b><span>Keyword rules set topic, impact, audience</span></div><div class="step"><b>MODEL</b><span>Star schema, DAX measures</span></div><div class="step"><b>REPORT</b><span>Power BI pages by department</span></div></div>`)}${card('Data and limits',`<p class="note2" style="color:var(--ink)">All records are <b>synthetic sample data</b> created for demonstration. They are not real announcements and not legal advice.</p><p class="note2" style="margin-top:8px">Impact and topic come from keyword rules, not legal review. A change can reach more than one department, so department counts add up to more than the total.</p>`)}</div>
<div class="g21">${card('Definitions',`<div class="defs"><div><b>Impact</b>High, Medium or Low, set by keywords such as penalty, mandatory or must.</div><div><b>Action required</b>The change states an obligation or step the firm must take.</div><div><b>Open action</b>Action required and status is not Actioned.</div><div><b>Deadline</b>Date taken from the text of the change. Blank when none is stated.</div><div><b>Days left</b>Deadline minus today. Negative means overdue.</div><div><b>Actioned rate</b>Share of changes whose status is Actioned.</div></div>`)}${card('Sources and tools',`<div class="bdg" style="margin-bottom:12px">${AGS.map(a=>`<span>${a}</span>`).join('')}</div><div class="bdg"><span>Python</span><span>SQLite</span><span>Power Query</span><span>DAX</span><span>Power BI</span><span>Star schema</span></div><p class="note2" style="margin-top:12px">Agency badges are plain text labels. They are not official logos.</p>`)}</div>
${card('Department mapping',`<div class="defs">${Object.entries(DEPMAP).map(([t,d])=>`<div><b>${t}</b>${d.join(' and ')}</div>`).join('')}</div>`)}`}

function build(){const v=$('#view');v.innerHTML=PAGE==='overview'?viewOverview():isDept()?viewDept():PAGE==='tracker'?viewTracker():PAGE==='finance'?viewFinance():PAGE==='capacity'?viewCapacity():viewAbout();BUILT=PAGE}

function applyTheme(i){const root=document.documentElement,t=THEMES[i][1];
 ['--navy','--navy0','--navy1','--navy2','--navy3','--bt','--bs','--gold','--gold2','--gold3','--pg1','--pg2','--pg3','--page','--pill','--pillt','--mute','--tm0','--tm1','--ink','--mut','--line'].forEach(k=>root.style.removeProperty(k));
